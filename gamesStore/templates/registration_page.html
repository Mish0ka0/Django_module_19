<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    {% if error %}
        <h2>{{ error }}</h2>
    {% endif %}
    <form method="post">
        {% csrf_token %}

        <label for="username">Введите логин:</label>
        <input type="text" id="username" name="username" maxlength="30" value="{{ username }}" required>

        <label for="password">Ввдеите пароль:</label>
        <input type="text" id="password" name="password" minlength="8" value="{{ password }}" required>

        <label for="repeat_password">Повторите пароль:</label>
        <input type="text" id="repeat_password" name="repeat_password" minlength="8" value="{{ repeat_password }}" required>

        <label for="age">Введите свой возраст:</label>
        <input type="text" id="age" name="age" maxlength="3" value="{{ age }}" required>
        <button type="submit" value="OK">Зарегистрироваться</button>
    </form>
</body>
</html>
